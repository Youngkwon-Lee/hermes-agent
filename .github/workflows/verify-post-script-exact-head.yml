name: Verify post-script exact head

on:
  push:
    branches:
      - verify/post-script-71de98a

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install test environment
        run: uv sync --locked --python 3.11 --extra dev
      - name: Run targeted cron tests
        run: uv run pytest -q tests/cron/test_cron_script.py tests/cron/test_run_one_job.py
